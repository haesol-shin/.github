name: Repository policy baseline measurement
description: Measure one production composite-action invocation without changing its implementation
inputs:
  github-token:
    required: true
  check:
    required: true
  sample:
    required: true
  phase:
    required: true
runs:
  using: composite
  steps:
    - name: Start wall-time and RSS measurement
      shell: bash
      env:
        SAMPLE: ${{ inputs.sample }}
        PHASE: ${{ inputs.phase }}
      run: |
        set -euo pipefail
        record_dir="${RUNNER_TEMP}/python-policy-baseline"
        mkdir -p "$record_dir"
        prefix="${record_dir}/sample-${SAMPLE}-${PHASE}"
        if [[ -d .repo-ops/actions/repository-policy/.venv ]]; then
          printf 'true\n' > "${prefix}.venv-before"
        else
          printf 'false\n' > "${prefix}.venv-before"
        fi
        if command -v uv >/dev/null 2>&1; then
          printf 'true\n' > "${prefix}.uv-available-before"
        else
          printf 'false\n' > "${prefix}.uv-available-before"
        fi
        printf '%s\n' "${UV_CACHE_DIR:-}" > "${prefix}.uv-cache-dir-before"
        date +%s%N > "${prefix}.start-ns"
        python3 - "$prefix" >"${prefix}.monitor.log" 2>&1 <<'PY' &
        import os
        import json
        import sys
        import time
        from pathlib import Path

        prefix = Path(sys.argv[1])
        stop = Path(str(prefix) + ".stop")
        peak = 0
        observed = False
        peak_processes = []

        def processes():
            result = {}
            for entry in Path("/proc").iterdir():
                if not entry.name.isdigit():
                    continue
                try:
                    status = (entry / "status").read_text(encoding="utf-8")
                    cmdline = (entry / "cmdline").read_bytes().replace(b"\0", b" ").decode("utf-8", "replace")
                except (FileNotFoundError, PermissionError, ProcessLookupError):
                    continue
                parent = 0
                rss = 0
                for line in status.splitlines():
                    if line.startswith("PPid:"):
                        parent = int(line.split()[1])
                    elif line.startswith("VmRSS:"):
                        rss = int(line.split()[1])
                result[int(entry.name)] = (parent, rss, cmdline)
            return result

        while not stop.exists():
            table = processes()
            roots = {
                pid for pid, (_, _, cmdline) in table.items()
                if "actions/repository-policy/validate.py" in cmdline
            }
            if roots:
                observed = True
                descendants = set(roots)
                changed = True
                while changed:
                    changed = False
                    for pid, (parent, _, _) in table.items():
                        if parent in descendants and pid not in descendants:
                            descendants.add(pid)
                            changed = True
                total = sum(table[pid][1] for pid in descendants if pid in table)
                if total > peak:
                    peak = total
                    peak_processes = [
                        {
                            "pid": pid,
                            "ppid": table[pid][0],
                            "rss_kib": table[pid][1],
                            "cmdline": table[pid][2],
                        }
                        for pid in sorted(descendants)
                        if pid in table
                    ]
            time.sleep(0.001)
        Path(str(prefix) + ".rss-kib").write_text(f"{peak}\n", encoding="utf-8")
        Path(str(prefix) + ".observed").write_text(f"{str(observed).lower()}\n", encoding="utf-8")
        Path(str(prefix) + ".peak-processes.json").write_text(
            json.dumps(peak_processes, indent=2) + "\n",
            encoding="utf-8",
        )
        PY
        printf '%s\n' "$!" > "${prefix}.monitor-pid"
    - id: validator
      name: Invoke production repository-policy action
      continue-on-error: true
      uses: ./.repo-ops/actions/repository-policy
      with:
        github-token: ${{ inputs.github-token }}
        check: ${{ inputs.check }}
    - name: Finish measurement
      if: always()
      shell: bash
      env:
        SAMPLE: ${{ inputs.sample }}
        PHASE: ${{ inputs.phase }}
        CHECK: ${{ inputs.check }}
        ACTION_OUTCOME: ${{ steps.validator.outcome }}
      run: |
        set -euo pipefail
        record_dir="${RUNNER_TEMP}/python-policy-baseline"
        prefix="${record_dir}/sample-${SAMPLE}-${PHASE}"
        end_ns="$(date +%s%N)"
        touch "${prefix}.stop"
        monitor_pid="$(cat "${prefix}.monitor-pid")"
        for _ in {1..1000}; do
          if ! kill -0 "$monitor_pid" 2>/dev/null; then
            break
          fi
          sleep 0.01
        done
        if kill -0 "$monitor_pid" 2>/dev/null; then
          kill "$monitor_pid" 2>/dev/null || true
          echo "RSS monitor did not stop" >&2
          exit 1
        fi
        start_ns="$(cat "${prefix}.start-ns")"
        peak_rss_kib="$(cat "${prefix}.rss-kib")"
        observed="$(cat "${prefix}.observed")"
        START_NS="$start_ns" END_NS="$end_ns" PEAK_RSS_KIB="$peak_rss_kib" OBSERVED="$observed" \
          python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        start_ns = int(os.environ["START_NS"])
        end_ns = int(os.environ["END_NS"])
        prefix = Path(os.environ["RUNNER_TEMP"]) / "python-policy-baseline" / f"sample-{os.environ['SAMPLE']}-{os.environ['PHASE']}"
        record = {
            "sample": int(os.environ["SAMPLE"]),
            "phase": os.environ["PHASE"],
            "check": os.environ["CHECK"],
            "action_outcome": os.environ["ACTION_OUTCOME"],
            "start_ns": start_ns,
            "end_ns": end_ns,
            "wall_ms": (end_ns - start_ns) // 1_000_000,
            "peak_rss_kib": int(os.environ["PEAK_RSS_KIB"]),
            "peak_processes": json.loads(Path(str(prefix) + ".peak-processes.json").read_text(encoding="utf-8")),
            "validator_process_observed": os.environ["OBSERVED"] == "true",
            "rss_method": "1ms /proc scan; sum VmRSS for validate.py roots and descendants",
            "runner_os": os.environ["RUNNER_OS"],
            "run_id": os.environ["GITHUB_RUN_ID"],
            "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
            "source_commit": "101f601f6022954d8b4e466d8280dc064f94e393",
            "cache_observation": {
                "validator_venv_before": Path(str(prefix) + ".venv-before").read_text(encoding="utf-8").strip() == "true",
                "uv_available_before": Path(str(prefix) + ".uv-available-before").read_text(encoding="utf-8").strip() == "true",
                "uv_cache_dir_before": Path(str(prefix) + ".uv-cache-dir-before").read_text(encoding="utf-8").strip(),
            },
            "cache_note": "production setup-uv cache enabled; phase names describe invocation order and check type, not a causal cache-only comparison",
        }
        path = Path(os.environ["RUNNER_TEMP"]) / "python-policy-baseline" / f"sample-{record['sample']}-{record['phase']}.json"
        path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
        PY
        [[ "$observed" == "true" ]]
