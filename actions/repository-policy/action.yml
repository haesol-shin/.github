name: Repository policy contract
description: Validate repository policy, approvals, and exact-head merge receipts without executing pull request code
inputs:
  github-token:
    description: Read-only token used to inspect pull request metadata and base-owned policy
    required: true
  mode:
    description: advisory reports findings without failing; enforce fails on findings
    required: false
    default: advisory
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
    - name: Validate repository contract
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs['github-token'] }}
      run: uv run --project "${{ github.action_path }}" --locked python "${{ github.action_path }}/validate.py" --event "$GITHUB_EVENT_PATH" --mode "${{ inputs.mode }}"
