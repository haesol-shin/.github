name: Repository policy contract
description: Validate repository policy, approvals, and exact-head merge receipts without executing pull request code
inputs:
  github-token:
    description: Read-only token used to inspect pull request metadata and base-owned policy
    required: true
  check:
    description: "Stable evaluator surface: contract or merge-approval"
    required: false
    default: merge-approval
runs:
  using: composite
  steps:
    - name: Validate repository contract
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs['github-token'] }}
        INPUT_CHECK: ${{ inputs.check }}
      run: "${GITHUB_ACTION_PATH}/run.sh"
