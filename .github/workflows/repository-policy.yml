name: Repository policy contract

on:
  workflow_call:
    inputs:
      contract-ref:
        description: Immutable commit SHA containing the validator and schemas
        required: true
        type: string
      head-sha:
        description: Exact pull request head SHA receiving policy check runs
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Validate immutable contract reference
        env:
          CONTRACT_REF: ${{ inputs['contract-ref'] }}
        run: |
          [[ "$CONTRACT_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "contract-ref must be a full commit SHA" >&2
            exit 1
          }
      - name: Revoke stale exact-head results
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs['head-sha'] }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          for check_name in "contract" "merge approval"; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f "name=${check_name}" \
              -f "head_sha=${HEAD_SHA}" \
              -f "status=completed" \
              -f "conclusion=failure" \
              -f "output[title]=Validation pending" \
              -f "output[summary]=Previous policy result revoked before candidate validation."
          done
      - name: Fetch trusted validator
        env:
          CONTRACT_REF: ${{ inputs['contract-ref'] }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/haesol-shin/.github.git .repo-ops
          git -C .repo-ops checkout --detach "$CONTRACT_REF"
      - name: Validate repository contract
        id: contract
        continue-on-error: true
        uses: ./.repo-ops/actions/repository-policy
        with:
          github-token: ${{ github.token }}
          check: contract
      - name: Validate merge approval
        id: merge
        continue-on-error: true
        uses: ./.repo-ops/actions/repository-policy
        with:
          github-token: ${{ github.token }}
          check: merge-approval
      - name: Publish exact-head policy checks
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs['head-sha'] }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$CONTRACT_OUTCOME" == "success" ]]; then
            contract_conclusion=success
          else
            contract_conclusion=failure
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f "name=contract" \
            -f "head_sha=${HEAD_SHA}" \
            -f "status=completed" \
            -f "conclusion=${contract_conclusion}" \
            -f "output[title]=Contract evaluation" \
            -f "output[summary]=Trusted base-owned contract evaluation completed."
          if [[ "$CONTRACT_OUTCOME" == "success" && "$MERGE_OUTCOME" == "success" ]]; then
            merge_conclusion=success
          else
            merge_conclusion=failure
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f "name=merge approval" \
            -f "head_sha=${HEAD_SHA}" \
            -f "status=completed" \
            -f "conclusion=${merge_conclusion}" \
            -f "output[title]=Merge approval evaluation" \
            -f "output[summary]=Trusted base-owned exact-head evaluation completed."
          [[ "$contract_conclusion" == "success" && "$merge_conclusion" == "success" ]]
