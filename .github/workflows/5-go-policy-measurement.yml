# Isolated post-cutover evidence only. Never merge this workflow.
name: Go production policy measurement

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  go-policy-measurement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: go-policy-measurement-${{ matrix.sample }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5]
    steps:
      - name: Check out measurement harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out exact Go production tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 6f310d48eccc86493ee89961a31f9fae1a178024
          path: .repo-ops
      - name: Measure first contract invocation
        uses: ./actions/repository-policy-measurement
        with:
          github-token: ${{ github.token }}
          check: contract
          sample: ${{ matrix.sample }}
          phase: first
      - name: Measure second merge-approval invocation
        uses: ./actions/repository-policy-measurement
        with:
          github-token: ${{ github.token }}
          check: merge-approval
          sample: ${{ matrix.sample }}
          phase: second
      - name: Upload Go policy measurement sample
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-policy-measurement-${{ matrix.sample }}
          path: ${{ runner.temp }}/go-policy-measurement/sample-*.json
          if-no-files-found: error
