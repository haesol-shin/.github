# Isolated pre-cutover evidence only. Never merge this workflow.
name: Published Go live shadow

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  live-shadow:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out measurement harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out exact Python production tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 101f601f6022954d8b4e466d8280dc064f94e393
          path: .repo-ops
      - name: Install production Python runtime
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          cache-dependency-glob: .repo-ops/actions/repository-policy/uv.lock
      - name: Download and verify published Go validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/live-shadow"
          gh release download repo-ops-validator-101f601f6022954d8b4e466d8280dc064f94e393 \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/live-shadow" \
            --pattern repo-ops-validator-linux-amd64-sha256-1fc619b35ac8c1643fe63c88dd7d51288a312d9f2d5a29a41184628a6fd73658
          binary="${RUNNER_TEMP}/live-shadow/repo-ops-validator-linux-amd64-sha256-1fc619b35ac8c1643fe63c88dd7d51288a312d9f2d5a29a41184628a6fd73658"
          [[ "$(stat -c %s "$binary")" == 8633358 ]]
          printf '%s  %s\n' 1fc619b35ac8c1643fe63c88dd7d51288a312d9f2d5a29a41184628a6fd73658 "$binary" | sha256sum --check --strict
          chmod 0755 "$binary"
      - name: Compare Python production with published Go binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_OPS_CONTRACT_ROOT: ${{ github.workspace }}/.repo-ops
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/live-shadow"
          binary="${output}/repo-ops-validator-linux-amd64-sha256-1fc619b35ac8c1643fe63c88dd7d51288a312d9f2d5a29a41184628a6fd73658"
          for check in contract merge-approval; do
            set +e
            uv run --project .repo-ops/actions/repository-policy --locked python \
              .repo-ops/actions/repository-policy/validate.py \
              --event "$GITHUB_EVENT_PATH" --check "$check" \
              --digest-out "${output}/python-${check}-digests.json" \
              >"${output}/python-${check}.stdout" 2>"${output}/python-${check}.stderr"
            python_exit=$?
            "$binary" --event "$GITHUB_EVENT_PATH" --check "$check" \
              --digest-out "${output}/go-${check}-digests.json" \
              >"${output}/go-${check}.stdout" 2>"${output}/go-${check}.stderr"
            go_exit=$?
            set -e
            printf '%s\n' "$python_exit" > "${output}/python-${check}.exit"
            printf '%s\n' "$go_exit" > "${output}/go-${check}.exit"
          done
          python3 - "$output" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          prefix = "::warning title=Repository policy::"
          summary = {
              "source_commit": "101f601f6022954d8b4e466d8280dc064f94e393",
              "artifact_sha256": "sha256:1fc619b35ac8c1643fe63c88dd7d51288a312d9f2d5a29a41184628a6fd73658",
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "checks": {},
          }
          divergent = False
          for check in ("contract", "merge-approval"):
              rows = {}
              for impl in ("python", "go"):
                  stdout = (root / f"{impl}-{check}.stdout").read_text(encoding="utf-8")
                  stderr = (root / f"{impl}-{check}.stderr").read_text(encoding="utf-8")
                  rows[impl] = {
                      "exit": int((root / f"{impl}-{check}.exit").read_text()),
                      "findings": [line.removeprefix(prefix) for line in stdout.splitlines() if line.startswith(prefix)],
                      "digests": json.loads((root / f"{impl}-{check}-digests.json").read_text(encoding="utf-8")),
                      "stderr": stderr,
                  }
              equal = (
                  rows["python"]["exit"] == rows["go"]["exit"]
                  and rows["python"]["findings"] == rows["go"]["findings"]
                  and rows["python"]["digests"] == rows["go"]["digests"]
              )
              divergent = divergent or not equal
              summary["checks"][check] = {
                  "equal": equal,
                  "python": rows["python"],
                  "go": rows["go"],
              }
          token = os.environ["GITHUB_TOKEN"].encode()
          captured = [path for path in root.iterdir() if path.is_file()]
          summary["credential_absent_from_captured_bytes"] = all(token not in path.read_bytes() for path in captured)
          divergent = divergent or not summary["credential_absent_from_captured_bytes"]
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          if divergent:
              raise SystemExit("published Go live shadow diverged")
          PY
      - name: Upload live-shadow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-go-live-shadow
          path: ${{ runner.temp }}/live-shadow
          if-no-files-found: error
