# Isolated Stage 2 evidence only. Not production. Delete in the Stage 3 cutover PR.
name: Go validator benchmark

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-clean-ci:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: go-clean-ci-${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5]
    steps:
      - name: Check out Stage 2 tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Go without cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Time exact proposed quality command
        env:
          SAMPLE: ${{ matrix.sample }}
          GOMODCACHE: ${{ runner.temp }}/go-mod-${{ matrix.sample }}
          GOCACHE: ${{ runner.temp }}/go-build-${{ matrix.sample }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bench"
          start_ns="$(date +%s%N)"
          set +e
          go test ./...
          status=$?
          set -e
          end_ns="$(date +%s%N)"
          START_NS="${start_ns}" END_NS="${end_ns}" STATUS="${status}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          start_ns = int(os.environ["START_NS"])
          end_ns = int(os.environ["END_NS"])
          record = {
              "sample": int(os.environ["SAMPLE"]),
              "sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "job": "go-clean-ci-" + os.environ["SAMPLE"],
              "command": "go test ./...",
              "go_test_wall_ms": (end_ns - start_ns) // 1_000_000,
              "go_test_exit": int(os.environ["STATUS"]),
              "cache": False,
              "gomodcache": os.environ["GOMODCACHE"],
              "gocache": os.environ["GOCACHE"],
              "source": "5-go-validator-benchmark.yml",
              "note": (
                  "Authoritative clean_ci_wall_ms is this GitHub job duration "
                  "on empty-cache ubuntu-latest, not this inner go test interval "
                  "alone. Do not copy local go test times into clean_ci_wall_ms."
              ),
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "bench" / "sample.json"
          path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
          exit "${status}"

      - name: Upload sample timing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-clean-ci-sample-${{ matrix.sample }}
          path: ${{ runner.temp }}/bench/sample.json
          if-no-files-found: error
