name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: CI / quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out contract repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned validator dependencies
        run: python3 -m pip install --disable-pip-version-check -r actions/repository-policy/requirements.txt
      - name: Run contract conformance suite
        run: python3 -m unittest discover -s tests -v
