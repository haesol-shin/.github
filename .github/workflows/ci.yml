name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out contract repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Go from module declaration
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run contract conformance suite
        run: go test ./...
